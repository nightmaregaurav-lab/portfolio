name: Generate upload thumbnails

on:
  push:
    paths:
      - "public/uploads/**"
      - ".github/workflows/generate-thumbnails.yml"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-thumbnails
  cancel-in-progress: false

jobs:
  generate-thumbnails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install image processor
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate and clean thumbnails
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source_root = Path("public/uploads")
          thumbnail_root = Path("public/uploads_thumbs")
          thumbnail_root.mkdir(parents=True, exist_ok=True)
          supported_extensions = {".avif", ".gif", ".jpeg", ".jpg", ".png", ".webp"}
          source_paths = set()

          for source in source_root.rglob("*"):
              if not source.is_file() or source.suffix.lower() not in supported_extensions:
                  continue

              relative_path = source.relative_to(source_root)
              source_paths.add(relative_path)
              destination = thumbnail_root / relative_path
              destination.parent.mkdir(parents=True, exist_ok=True)

              if destination.exists() and destination.stat().st_mtime >= source.stat().st_mtime:
                  continue

              try:
                  with Image.open(source) as image:
                      image.thumbnail((640, 640), Image.Resampling.LANCZOS)
                      save_kwargs = {}
                      if image.format in {"JPEG", "WEBP"}:
                          save_kwargs = {"optimize": True, "quality": 82}
                      image.save(destination, **save_kwargs)
              except Exception as error:
                  print(f"Skipping {source}: {error}")

          for thumbnail in thumbnail_root.rglob("*"):
              if thumbnail.is_file() and thumbnail.relative_to(thumbnail_root) not in source_paths:
                  thumbnail.unlink()
          for directory in sorted(thumbnail_root.rglob("*"), reverse=True):
              if directory.is_dir() and not any(directory.iterdir()):
                  directory.rmdir()
          PY

      - name: Commit generated thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/uploads_thumbs
          if git diff --cached --quiet; then
            echo "No thumbnail changes."
            exit 0
          fi
          git pull --rebase
          git commit -m "Generate upload thumbnails"
          git push
