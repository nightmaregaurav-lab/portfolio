name: Migrate portfolio configuration

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "public/uploads*/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: migrate-config
  cancel-in-progress: false

jobs:
  migrate:
    if: >-
      github.event.repository.fork == true &&
      (github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Migrate configuration')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate configuration
        run: pnpm migrate-config

      - name: Commit migrated configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/config
          if git diff --cached --quiet; then
            echo "No configuration changes."
            exit 0
          fi
          git commit -m "Migrate configuration"
          git push

      - name: Deploy migrated site
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "deploy-pages.yml",
              ref: context.ref.replace("refs/heads/", ""),
            })
